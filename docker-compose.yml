services:
  backend:
    image: alfa-backend
    container_name: alfa-backend
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5433/alfacontrol
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  frontend:
    build:
      context: ./alfa-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8081/api
    image: alfa-frontend
    container_name: alfa-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped