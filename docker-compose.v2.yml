services:
  backend:
    image: ghcr.io/vikasheree/alfa-backend:d07731d
    container_name: alfa-v2-backend
    environment:
      DB_URL: ${DB_URL:?DB_URL must be set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    restart: unless-stopped

  frontend:
    image: ghcr.io/vikasheree/alfa-frontend:d07731d
    container_name: alfa-v2-frontend
    ports:
      - "127.0.0.1:5177:80"
    depends_on:
      - backend
    restart: unless-stopped