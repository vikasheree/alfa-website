name: Frontend CI

on:
  push:
    branches:
      - develop-v2
  pull_request:
    branches:
      - develop-v2

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Validate Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: alfa-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alfa-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_SITE_URL: https://alfacontrolsystems.in
          VITE_API_BASE_URL: /api
        run: npm run build
